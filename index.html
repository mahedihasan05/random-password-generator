<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="font-mono bg-slate-800">
    <div class="flex justify-center items-center min-h-screen flex-col">
        <div class="p-10">
            <h1 class="text-4xl md:text-5xl font-semibold text-white mb-4">Generate a <br><span
                    class="text-[#009f55] underline underline-offset-8">Random Password</span></h1>
            <div class="flex items-center gap-4 mb-4 bg-white px-6 py-2 rounded-md">
                <input type="text" placeholder="Password" class="text-gray-900 text-3xl outline-none border-none" id="generate">
                <img src="images/copy.png" class="w-5 md:w-10 cursor-pointer">
            </div>
            <button
                class="text-white font-semibold text-2xl flex items-center justify-between bg-[#009f55] rounded-md px-4 py-2 cursor-pointer gap-2 outline-none border-none">
                <img src="images/generate.png" class="w-5 md:w-10">Generate Password</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
